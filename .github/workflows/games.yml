name: Games card
on:
  schedule: [{cron: "17 3 * * *"}]   # elke nacht
  workflow_dispatch:                  # handmatig: Actions -> Games card -> Run workflow
  push:
    paths: ["games.json", "scripts/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Maak games.svg
        env:
          STEAM_TOKEN: ${{ secrets.STEAM_TOKEN }}
          STEAM_ID_2: ${{ secrets.STEAM_ID_2 }}
          R6_API_KEY: ${{ secrets.R6_API_KEY }}
        run: python3 scripts/games_card.py
      - name: Commit als er iets veranderd is
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.svg .games-cache.json
          git diff --cached --quiet || git commit -m "Update games card"
          git push
