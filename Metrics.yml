# Pad in je repo: .github/workflows/metrics.yml
# Enige secret die nodig is: STEAM_TOKEN (je Steam Web API key)

name: Steam card
on:
  schedule: [{cron: "17 3 * * *"}]
  workflow_dispatch:

jobs:
  steam:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          committer_token: ${{ github.token }}
          filename: metrics.steam.svg
          base: ""
          config_timezone: Europe/Amsterdam
          plugin_steam: yes
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
          plugin_steam_user: "76561199239386016"
          plugin_steam_sections: most-played, recently-played
          plugin_steam_games_limit: 3
          plugin_steam_recent_games_limit: 2
          plugin_steam_achievements_limit: 0
